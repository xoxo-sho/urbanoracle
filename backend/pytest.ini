[pytest]
testpaths = tests
pythonpath = .
# An empty parametrize argvalues list is reported as a single SKIPPED
# placeholder by default, which is indistinguishable from a deliberate skip in
# a green run, so a suite deriving its cases from imported state can cover
# nothing while CI stays green.
#
# In the sibling repo landcast that hid a route-lockdown suite running ZERO
# cases for 46 days: it built its parameters from `app.routes`, fastapi 0.137.0
# stopped flattening sub-routers into that list, and a deliberately unprotected
# route answering an anonymous caller with 200 left the suite fully green
# (xoxo-sho/landcast#14).
empty_parameter_set_mark = fail_at_collect
