name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by deploy.yml so nothing reaches Cloud Run without passing CI, and
  # so the image deploy.yml ships is the one the `image` job below built and
  # smoked. Only that call sets push_image: the standalone push/pull_request
  # runs of this same file see it unset (false), so they never push — even on
  # main, where both runs happen for every push.
  workflow_call:
    inputs:
      push_image:
        description: "Build with the production config, then push the smoked image and output its digest (deploy.yml only)"
        type: boolean
        default: false
    secrets:
      NEXT_PUBLIC_FIREBASE_API_KEY:
        required: false
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:
        required: false
      NEXT_PUBLIC_FIREBASE_PROJECT_ID:
        required: false
      NEXT_PUBLIC_FIREBASE_APP_ID:
        required: false
      NEXT_PUBLIC_SITE_URL:
        required: false
    outputs:
      image_digest:
        description: "sha256 digest of the image the image job smoked and pushed (empty unless push_image)"
        value: ${{ jobs.image.outputs.digest }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ---- dxa-ui font gate (Track 1) ------------------------------------------
      # This workflow is what deploy.yml calls (workflow_call) and
      # `deploy: needs: ci`, so a red step here blocks the deploy (shape A;
      # the deploy's paths-ignore matches none of these inputs). Four checks:
      #   0/3 drift    — vendored token bytes match .dxa-ui-version
      #   1/3 static   — no JA text through a CJK-less stack, incl. the v4
      #                  @theme keys (this theme is `inline`: the key is the
      #                  only place the stack exists in source); token rules
      #   1b  encoding — the EMITTED CSS carries the JA local() names as UTF-8
      #   2/3+3/3 metrics — a headless browser proves JA/Latin/mono render in
      #                  the delivered faces by EFFECTIVE font-family (inline
      #                  theme emits no --font-* runtime vars), asserts the
      #                  heading stack is untouched, and asserts the runtime
      #                  check's console line (the tree mounts on the
      #                  placeholder structural build below).
      # Not covered: DXA JA Fallback Windows/Legacy local() faces (no Windows
      # runner; the Apple test self-skips on ubuntu).
      - name: "Font check 0/3 — drift: vendored dxa-ui tokens match .dxa-ui-version"
        run: npm run check:dxa-drift
      - name: "Font check 1/3 — static: no JA text through a CJK-less stack; token rules"
        run: npm run check:fonts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # design-spec-v1 §8: the H項 list is enforced structurally, so a
      # reintroduced glassmorphism/blob/emoji fails the build rather than
      # being caught (or missed) in review.
      - name: H項 audit
        run: npm run audit:h

      # Structural static-export build. The config values are dummy but are
      # NOT on the placeholder deny-list, so a build that simply lost its
      # arguments stays distinguishable from this one. The real-config
      # assertions run in the image job below, on the build deploy.yml ships,
      # with the real appId.
      #
      # It runs with NO NETWORK: scripts/build-offline.sh starts `npm run
      # build` in the Dockerfile's node:20-slim with `--network none`, after
      # checking that the container cannot reach fonts.googleapis.com or
      # fonts.gstatic.com. The web fonts and the OG card's fonts are vendored
      # (public/fonts, src/app/_og-fonts, scripts/vendor-fonts.mjs), so the
      # build needs nothing from outside; a next/font/google import, or OG
      # text the vendored fonts lack, fails here on every pull request rather
      # than at deploy (vercel/next.js#99114 failed 2 of the 10 deploys up to
      # 2026-11-09). Every step below reads this out/.
      - name: Build (static export) — offline, in a container with no network
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: structural-check-build
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dxalabs-platform.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dxalabs-platform
          NEXT_PUBLIC_FIREBASE_APP_ID: structural-check-build
          NEXT_PUBLIC_SITE_URL: https://urbanoracle.dxalabs.com
        run: bash scripts/build-offline.sh

      - name: Verify bundle structure
        run: SKIP_REAL_CONFIG=1 npm run verify:bundle

      - name: "Font check 1b — build output: emitted CSS is UTF-8 with the JA local() names"
        run: npm run check:css-encoding

      # The gate that decides whether a bundle may ship is itself tested:
      # every assertion is broken in turn and must turn the verifier red,
      # including the canonical-absence discriminator (LP served at /app).
      - name: Verifier self-test (fault injection)
        run: npm run verify:bundle:selftest

      # A present-but-nonsense build arg once shipped ("-" in every secret).
      # This proves the guard that now rejects that class still works.
      - name: Build-arg guard self-test
        run: npm run verify:guard

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: "Font check 2/3 + 3/3 — metrics on out/; runtime check console asserted"
        # Serves out/ with a static server (own config, no dev server). The
        # fonts are vendored in the repo (public/fonts, scripts/vendor-fonts.mjs).
        # e2e/font-origin.spec.ts runs here too: on /, /login and /app every
        # font comes from this origin and no request goes to Google Fonts.
        run: npm run test:fonts
      # The landing page's JA/EN toggle, against the same out/ built above:
      # python3's http.server on its own port, 1440×900 and 390×844 — default
      # Japanese, zero Japanese left in English, persistence, ?lang=, overflow,
      # keyboard, rendered contrast, no foreign requests (playwright.lp.config.ts).
      - name: "LP — JA/EN toggle (1440×900, 390×844)"
        run: npm run test:lp
      # The split sign-in screens (/login, /pending) and /forgot-password,
      # against the same out/ (playwright.login.config.ts, its own port):
      # 50/50 split and the 1080px breakpoint, form order, keyboard, mode
      # rules, panel motion / ghosting / reduced motion / no numerals, JA/EN,
      # rendered contrast in both themes, the <title> race in its reproducing
      # cell (P1, no throttling, 1× CPU; 10 loads per page — the wider S1′
      # matrix runs only locally with LANG_TITLE_MATRIX=1), and zero escaped
      # identity requests.
      - name: "Login — split shell, panel, JA/EN, title race"
        env:
          LANG_TITLE_LOADS: "10"
        run: npm run test:login
      - name: "App credits — 地理院タイル basemap, no CARTO request, expanded attribution (1440×900, 390×844)"
        run: npm run test:credits
      - name: Upload font check report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: font-metrics-report
          path: playwright-report
          if-no-files-found: ignore

  # The production image: built ONCE here, booted, and — when deploy.yml
  # calls this workflow for a main deploy — pushed and handed to the deploy
  # job by digest (2026-11-14; RECON 2026-11-uo-build-once). Until then CI
  # smoked a structural build here and Cloud Build built the shipped image a
  # second time, so `boot` and `snapshot` never ran against what shipped.
  #
  # Pull requests (and the standalone push run of this file) build and smoke
  # with the structural config and never authenticate or push: every step that
  # does is gated on inputs.push_image, which only deploy.yml sets, and on
  # refs/heads/main. On a deploy the build takes the five production values
  # from the repo secrets (after the value guard), verify-bundle runs in
  # real-config mode as cloudbuild.yaml's verify-bundle step did, and the push
  # checks that the registry now holds exactly the image the smoke steps ran.
  image:
    name: Image build + smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Used only by the push steps on a main deploy (gated below). The WIF
      # provider's attributeCondition checks the repository, not the ref
      # (RECON 1d); restricting it to refs/heads/main is recommended in the PR.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: urbanoracle-smoke:${{ github.sha }}
      REGISTRY_IMAGE: asia-northeast1-docker.pkg.dev/urbanoracle/urbanoracle/urbanoracle
    steps:
      - uses: actions/checkout@v4

      # The image tag and NEXT_PUBLIC_BUILD_SHA (shown on /login): the 7-char
      # SHA, as Cloud Build's _IMAGE_TAG was.
      - id: meta
        name: Short SHA (image tag and NEXT_PUBLIC_BUILD_SHA)
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # A present-but-nonsense secret ("-") once shipped. Checked before the
      # build whose image is deployed; the values are never printed. If a
      # secret were empty, the build-args below would fall back to the
      # structural values — this step fails first, and verify-bundle's
      # EXPECT_APP_ID check would fail after it.
      - name: "deploy build: refuse degenerate build-arg values"
        if: inputs.push_image && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: bash scripts/ci/check-build-args.sh

      - uses: docker/setup-buildx-action@v3

      # One build. `load` puts it in the runner's docker for the smoke steps
      # and the push. No provenance/SBOM: an attestation would turn the pushed
      # artifact into an index, and every image in the registry is a single
      # linux/amd64 manifest (RECON 1b/1e). Layers are cached in the Actions
      # cache; a run on main restores only caches written on main.
      - name: Build image (linux/amd64; production config on a deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ steps.meta.outputs.short_sha }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'structural-check-build' }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dxalabs-platform.firebaseapp.com' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dxalabs-platform' }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_APP_ID || 'structural-check-build' }}
            NEXT_PUBLIC_SITE_URL=${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_SITE_URL || 'https://urbanoracle.dxalabs.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "smoke: runs as a non-root user"
        run: bash scripts/ci/image-smoke.sh user "$IMAGE"

      # Structural on pull requests; on a deploy, the real-config assertions
      # (authDomain, projectId, the exact appId, the site origin) that
      # cloudbuild.yaml's verify-bundle step used to run before its push.
      - name: "smoke: verify-bundle on the image's /app/static (real config on a deploy)"
        env:
          SKIP_REAL_CONFIG: ${{ !(inputs.push_image && github.ref == 'refs/heads/main') && '1' || '0' }}
          EXPECT_AUTH_DOMAIN: ${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dxalabs-platform.firebaseapp.com' }}
          EXPECT_PROJECT_ID: ${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dxalabs-platform' }}
          EXPECT_APP_ID: ${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '' }}
          EXPECT_SITE_ORIGIN: ${{ (inputs.push_image && github.ref == 'refs/heads/main') && secrets.NEXT_PUBLIC_SITE_URL || 'https://urbanoracle.dxalabs.com' }}
        run: bash scripts/ci/image-smoke.sh bundle "$IMAGE"

      - name: "smoke: boots — health, LP, fonts as font/woff2, GeoJSON, data routes 401"
        run: bash scripts/ci/image-smoke.sh boot "$IMAGE"

      - name: "smoke: refuses to start when a snapshot is missing"
        run: bash scripts/ci/image-smoke.sh snapshot "$IMAGE"

      # ---- main deploy only: push the image the steps above smoked ----------
      - id: auth
        if: inputs.push_image && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/89383988887/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@urbanoracle.iam.gserviceaccount.com

      - if: inputs.push_image && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      # No build here: the smoked local image is tagged and pushed as is. The
      # digest comes from the push; the registry's manifest for it must be a
      # single-platform image whose config digest is the smoked image's ID
      # (with the containerd image store, the ID is the manifest digest itself).
      - id: push
        name: "deploy: push the smoked image (tag = 7-char SHA) and output its digest"
        if: inputs.push_image && github.ref == 'refs/heads/main'
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGISTRY_IMAGE%%/*}" --quiet
          REF="${REGISTRY_IMAGE}:${SHORT_SHA}"
          docker tag "$IMAGE" "$REF"
          out="$(docker push "$REF")"
          printf '%s\n' "$out" | tail -2
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<<"$out" | tail -1)"
          if [ -z "$DIGEST" ]; then
            DIGEST="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REF" | sed -n "s#^${REGISTRY_IMAGE}@##p" | head -1)"
          fi
          if ! [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest for ${REF} after the push" >&2
            exit 1
          fi

          LOCAL_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          RAW="$(docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}@${DIGEST}")"
          MEDIA="$(jq -r '.mediaType // empty' <<<"$RAW")"
          CONFIG="$(jq -r '.config.digest // empty' <<<"$RAW")"
          case "$MEDIA" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
            *) echo "::error::${REGISTRY_IMAGE}@${DIGEST} is '${MEDIA}', not a single-platform image manifest" >&2; exit 1 ;;
          esac
          if [ "$CONFIG" != "$LOCAL_ID" ] && [ "$DIGEST" != "$LOCAL_ID" ]; then
            echo "::error::pushed manifest config ${CONFIG} is not the smoked image ${LOCAL_ID}" >&2
            exit 1
          fi
          echo "ok: pushed ${REF} as ${DIGEST}; config ${CONFIG} = smoked image ${LOCAL_ID}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    services:
      # postgres:16, NOT postgis — UrbanOracle persists identity only
      # (Stage 2a decision: zero geometry columns).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urbanoracle
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: urbanoracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanoracle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://urbanoracle:test_password@localhost:5432/urbanoracle_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run migrations (alembic upgrade head)
        working-directory: backend
        run: python -m alembic upgrade head

      # The live migration must produce a fail-closed default: a users row
      # the provisioning logic never evaluated can never be active.
      - name: Verify is_active default is false (live migration)
        run: |
          python - <<'EOF'
          import psycopg
          with psycopg.connect(
              "host=localhost dbname=urbanoracle_test user=urbanoracle password=test_password"
          ) as conn:
              default = conn.execute(
                  "SELECT column_default FROM information_schema.columns "
                  "WHERE table_name='users' AND column_name='is_active'"
              ).fetchone()[0]
          assert default == "false", f"is_active default is {default!r}, expected 'false'"
          print("ok: users.is_active default = false")
          EOF

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      # The image that ships is the image this workflow built and smoked:
      # deploy.yml builds nothing, takes the digest the image job pushed, and
      # a pull_request run never pushes (scripts/ci/test_pipeline.py).
      - name: Pipeline guards (build once, deploy by digest)
        run: python -m pytest -q -p no:cacheprovider scripts/ci/test_pipeline.py
