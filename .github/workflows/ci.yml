name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by deploy.yml so nothing reaches Cloud Run without passing CI.
  # dxa-migration is covered through that call rather than by its own push
  # trigger, which would otherwise run the whole suite twice per push.
  workflow_call:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ---- dxa-ui font gate (Track 1) ------------------------------------------
      # This workflow is what deploy.yml calls (workflow_call) and
      # `deploy: needs: ci`, so a red step here blocks the deploy (shape A;
      # the deploy's paths-ignore matches none of these inputs). Four checks:
      #   0/3 drift    — vendored token bytes match .dxa-ui-version
      #   1/3 static   — no JA text through a CJK-less stack, incl. the v4
      #                  @theme keys (this theme is `inline`: the key is the
      #                  only place the stack exists in source); token rules
      #   1b  encoding — the EMITTED CSS carries the JA local() names as UTF-8
      #   2/3+3/3 metrics — a headless browser proves JA/Latin/mono render in
      #                  the delivered faces by EFFECTIVE font-family (inline
      #                  theme emits no --font-* runtime vars), asserts the
      #                  heading stack is untouched, and asserts the runtime
      #                  check's console line (the tree mounts on the
      #                  placeholder structural build below).
      # Not covered: DXA JA Fallback Windows/Legacy local() faces (no Windows
      # runner; the Apple test self-skips on ubuntu).
      - name: "Font check 0/3 — drift: vendored dxa-ui tokens match .dxa-ui-version"
        run: npm run check:dxa-drift
      - name: "Font check 1/3 — static: no JA text through a CJK-less stack; token rules"
        run: npm run check:fonts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # design-spec-v1 §8: the H項 list is enforced structurally, so a
      # reintroduced glassmorphism/blob/emoji fails the build rather than
      # being caught (or missed) in review.
      - name: H項 audit
        run: npm run audit:h

      # Structural static-export build. The config values are dummy but are
      # NOT on the placeholder deny-list, so a build that simply lost its
      # arguments stays distinguishable from this one. The real-config
      # assertions run at image build time (Stage 5/6) with the real appId.
      - name: Build (static export)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: structural-check-build
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dxalabs-platform.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dxalabs-platform
          NEXT_PUBLIC_FIREBASE_APP_ID: structural-check-build
          NEXT_PUBLIC_SITE_URL: https://urbanoracle.dxalabs.com
        run: npm run build

      - name: Verify bundle structure
        run: SKIP_REAL_CONFIG=1 npm run verify:bundle

      - name: "Font check 1b — build output: emitted CSS is UTF-8 with the JA local() names"
        run: npm run check:css-encoding

      # The gate that decides whether a bundle may ship is itself tested:
      # every assertion is broken in turn and must turn the verifier red,
      # including the canonical-absence discriminator (LP served at /app).
      - name: Verifier self-test (fault injection)
        run: npm run verify:bundle:selftest

      # A present-but-nonsense build arg once shipped ("-" in every secret).
      # This proves the guard that now rejects that class still works.
      - name: Build-arg guard self-test
        run: npm run verify:guard

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: "Font check 2/3 + 3/3 — metrics on out/; runtime check console asserted"
        # Serves out/ with a static server (own config, no dev server). Fonts
        # are self-hosted by next/font — no network needed.
        run: npm run test:fonts
      - name: Upload font check report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: font-metrics-report
          path: playwright-report
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    services:
      # postgres:16, NOT postgis — UrbanOracle persists identity only
      # (Stage 2a decision: zero geometry columns).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urbanoracle
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: urbanoracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanoracle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://urbanoracle:test_password@localhost:5432/urbanoracle_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run migrations (alembic upgrade head)
        working-directory: backend
        run: python -m alembic upgrade head

      # The live migration must produce a fail-closed default: a users row
      # the provisioning logic never evaluated can never be active.
      - name: Verify is_active default is false (live migration)
        run: |
          python - <<'EOF'
          import psycopg
          with psycopg.connect(
              "host=localhost dbname=urbanoracle_test user=urbanoracle password=test_password"
          ) as conn:
              default = conn.execute(
                  "SELECT column_default FROM information_schema.columns "
                  "WHERE table_name='users' AND column_name='is_active'"
              ).fetchone()[0]
          assert default == "false", f"is_active default is {default!r}, expected 'false'"
          print("ok: users.is_active default = false")
          EOF

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
